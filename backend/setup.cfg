# Mutation audit scope (ai-testing-system maturity item 5).
# Run from backend/: `mutmut run` then `mutmut results`.
# Time-boxed per module: mutants only in the named source path, and each
# mutant is judged by its own test file, not the full suite.
# Note: mutmut's test-to-mutant association needs a Python/pytest pair it
# supports; on 3.14/pytest 9 use the manual sample audit recorded in
# docs/audit/03-TEST-SUITE-AUDIT.md instead.
[mutmut]
source_paths=app/infrastructure/k8s/mapper
pytest_add_cli_args_test_selection=tests/unit/infrastructure/test_k8s_mappers.py

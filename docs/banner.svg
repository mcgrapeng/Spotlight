<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="Spotlight banner">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1A1730"/>
      <stop offset="60%" stop-color="#0B0B12"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8EC5FF"/>
      <stop offset="55%" stop-color="#EFADF7"/>
      <stop offset="100%" stop-color="#FFD69B"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#E8E8FF"/>
    </linearGradient>
    <radialGradient id="beamGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFADF7" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#8EC5FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" fill="url(#bgGlow)"/>

  <!-- subtle grid lines -->
  <g stroke="#FAFAFA" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
  </g>

  <!-- beam glow behind logo -->
  <circle cx="240" cy="160" r="190" fill="url(#beamGlow)"/>

  <!-- LOGO MARK: hexagonal spotlight radar -->
  <g transform="translate(240 160)">
    <!-- beam spokes -->
    <g fill="none" stroke="url(#logoGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <polygon points="0,-78 67.6,-29.3 67.6,29.3 0,78 -67.6,29.3 -67.6,-29.3"/>
      <line x1="0" y1="0" x2="0" y2="-78"/>
      <line x1="0" y1="0" x2="67.6" y2="-29.3"/>
      <line x1="0" y1="0" x2="67.6" y2="29.3"/>
      <line x1="0" y1="0" x2="0" y2="78"/>
      <line x1="0" y1="0" x2="-67.6" y2="29.3"/>
      <line x1="0" y1="0" x2="-67.6" y2="-29.3"/>
    </g>
    <!-- inner hex -->
    <polygon points="0,-50 43.3,-20 43.3,20 0,50 -43.3,20 -43.3,-20"
             fill="none" stroke="#FAFAFA" stroke-width="1.4" stroke-linejoin="round" opacity="0.55"/>
    <!-- core -->
    <circle r="20" fill="#0B0B12" stroke="#FAFAFA" stroke-width="1.8"/>
    <circle r="9"  fill="url(#logoGrad)"/>
    <circle r="3.5" fill="#FAFAFA"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(380 0)">
    <text x="0" y="172"
          font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif"
          font-weight="800"
          font-size="92"
          letter-spacing="-4"
          fill="url(#wordGrad)">Spotlight</text>

    <!-- tagline -->
    <text x="4" y="216"
          font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif"
          font-weight="500"
          font-size="22"
          letter-spacing="0.5"
          fill="#A9A9B8">A Kubernetes dashboard that thinks with you.</text>

    <!-- colored dot accent under tagline -->
    <circle cx="6"  cy="248" r="4" fill="#8EC5FF"/>
    <circle cx="22" cy="248" r="4" fill="#EFADF7"/>
    <circle cx="38" cy="248" r="4" fill="#FFD69B"/>
    <text x="58" y="253"
          font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace"
          font-weight="500"
          font-size="14"
          letter-spacing="1.2"
          fill="#7A7A88">K8S  ·  VUE 3  ·  FASTAPI  ·  LITELLM  ·  MIT</text>
  </g>

  <!-- corner brand tag -->
  <g transform="translate(1180 40)" opacity="0.4">
    <text x="0" y="0"
          font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace"
          font-size="11"
          letter-spacing="2"
          fill="#FAFAFA">v2.0.0</text>
  </g>
</svg>

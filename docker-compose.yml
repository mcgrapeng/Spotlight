version: "3.9"

services:
  backend:
    build: ./backend
    container_name: k8s-viewer-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ~/.kube:/root/.kube:ro   # 挂载 tsh 生成的 kubeconfig
      - ./backend/data:/app/data
    environment:
      - KUBECONFIG=/root/.kube/config
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: k8s-viewer-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="Spotlight — A Kubernetes dashboard that thinks with you.">
  <defs>
    <radialGradient id="bgRad" cx="22%" cy="55%" r="80%">
      <stop offset="0%"   stop-color="#1A1730"/>
      <stop offset="55%"  stop-color="#0B0B12"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#8EC5FF"/>
      <stop offset="55%" stop-color="#EFADF7"/>
      <stop offset="100%" stop-color="#FFD69B"/>
    </linearGradient>
    <linearGradient id="word" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#DADAF0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#EFADF7" stop-opacity="0.45"/>
      <stop offset="55%"  stop-color="#8EC5FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.6" fill="#FAFAFA" opacity="0.08"/>
    </pattern>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#8EC5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EFADF7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD69B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- BG -->
  <rect width="1280" height="420" fill="url(#bgRad)"/>
  <rect width="1280" height="420" fill="url(#dots)"/>

  <!-- soft horizontal hairline accent -->
  <rect x="0" y="207" width="1280" height="1" fill="url(#hair)" opacity="0.6"/>

  <!-- ambient sparkles -->
  <g fill="#FAFAFA">
    <circle cx="160" cy="62"  r="1.2" opacity="0.55"/>
    <circle cx="92"  cy="340" r="0.9" opacity="0.45"/>
    <circle cx="240" cy="380" r="1.0" opacity="0.5"/>
    <circle cx="500" cy="58"  r="0.8" opacity="0.4"/>
    <circle cx="980" cy="92"  r="1.2" opacity="0.55"/>
    <circle cx="1180" cy="320" r="0.9" opacity="0.45"/>
    <circle cx="700" cy="350" r="0.8" opacity="0.4"/>
    <circle cx="1200" cy="180" r="1.0" opacity="0.5"/>
  </g>
  <g fill="#EFADF7">
    <circle cx="380" cy="92" r="0.9" opacity="0.55"/>
    <circle cx="1120" cy="60" r="0.8" opacity="0.50"/>
    <circle cx="540" cy="372" r="1.0" opacity="0.55"/>
  </g>

  <!-- LOGO COMPONENT (left, vertical-center) -->
  <g transform="translate(180 210)">
    <!-- soft halo -->
    <circle r="190" fill="url(#halo)"/>
    <!-- orbiting ping rings -->
    <circle r="146" fill="none" stroke="url(#brand)" stroke-width="0.8" opacity="0.30"/>
    <circle r="118" fill="none" stroke="url(#brand)" stroke-width="0.8" opacity="0.45"/>
    <!-- spokes -->
    <g stroke="#FAFAFA" stroke-width="1.4" stroke-linecap="round" opacity="0.62">
      <line x1="0" y1="0" x2="0"    y2="-128"/>
      <line x1="0" y1="0" x2="110.85" y2="-64"/>
      <line x1="0" y1="0" x2="110.85" y2="64"/>
      <line x1="0" y1="0" x2="0"    y2="128"/>
      <line x1="0" y1="0" x2="-110.85" y2="64"/>
      <line x1="0" y1="0" x2="-110.85" y2="-64"/>
    </g>
    <!-- outer hex (gradient) -->
    <polygon points="0,-128 110.85,-64 110.85,64 0,128 -110.85,64 -110.85,-64"
             fill="none" stroke="url(#brand)" stroke-width="4" stroke-linejoin="round"/>
    <!-- inner hex (subtle echo) -->
    <polygon points="0,-78 67.55,-39 67.55,39 0,78 -67.55,39 -67.55,-39"
             fill="none" stroke="#FAFAFA" stroke-width="1" opacity="0.30"/>
    <!-- lens -->
    <circle r="30" fill="#0B0B12" stroke="#FAFAFA" stroke-width="2.4"/>
    <!-- focal -->
    <circle r="14" fill="url(#brand)"/>
    <!-- highlight -->
    <circle cx="-4" cy="-4" r="3" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- WORDMARK + COPY -->
  <g transform="translate(440 0)">
    <text x="0" y="200"
          font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif"
          font-weight="800"
          font-size="120"
          letter-spacing="-5"
          fill="url(#word)">Spotlight</text>

    <!-- gradient underline + tagline -->
    <rect x="6" y="218" width="180" height="2" fill="url(#brand)"/>
    <text x="6" y="262"
          font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif"
          font-weight="500"
          font-size="26"
          letter-spacing="0.2"
          fill="#A9A9C2">A Kubernetes dashboard that thinks with you.</text>

    <!-- command preview line -->
    <g transform="translate(0 320)">
      <rect x="0" y="0" width="660" height="46" rx="10" fill="#11111A" stroke="#26253A" stroke-width="1"/>
      <text x="20" y="30" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace" font-size="15" fill="#7A7A95">$</text>
      <text x="42" y="30" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace" font-size="15" fill="#FAFAFA">pnpm dev</text>
      <text x="160" y="30" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace" font-size="15" fill="#5F5F75"># → :5173 · paste kubeconfig, log in, see what broke</text>
    </g>

    <!-- badge row -->
    <g transform="translate(0 84)" font-family="'Inter','SF Pro Display',-apple-system,Arial,sans-serif" font-weight="600">
      <g>
        <rect x="0" y="0" width="78" height="28" rx="14" fill="#1A1A24" stroke="#26253A"/>
        <text x="39" y="19" font-size="12" text-anchor="middle" fill="#8EC5FF" letter-spacing="1">v2.0</text>
      </g>
      <g transform="translate(88 0)">
        <rect x="0" y="0" width="68" height="28" rx="14" fill="#1A1A24" stroke="#26253A"/>
        <text x="34" y="19" font-size="12" text-anchor="middle" fill="#EFADF7" letter-spacing="1">K8S</text>
      </g>
      <g transform="translate(166 0)">
        <rect x="0" y="0" width="86" height="28" rx="14" fill="#1A1A24" stroke="#26253A"/>
        <text x="43" y="19" font-size="12" text-anchor="middle" fill="#FFD69B" letter-spacing="1">LITELLM</text>
      </g>
      <g transform="translate(262 0)">
        <rect x="0" y="0" width="100" height="28" rx="14" fill="#1A1A24" stroke="#26253A"/>
        <text x="50" y="19" font-size="12" text-anchor="middle" fill="#FAFAFA" letter-spacing="1">Type-safe</text>
      </g>
      <g transform="translate(372 0)">
        <rect x="0" y="0" width="64" height="28" rx="14" fill="#1A1A24" stroke="#26253A"/>
        <text x="32" y="19" font-size="12" text-anchor="middle" fill="#FAFAFA" letter-spacing="1">MIT</text>
      </g>
    </g>
  </g>

  <!-- top-right corner brand tag -->
  <g transform="translate(1140 50)" opacity="0.5">
    <text x="0" y="0"
          font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace"
          font-size="11"
          letter-spacing="2"
          fill="#FAFAFA">SPOTLIGHT · OSS</text>
  </g>

  <!-- bottom-right hairline -->
  <rect x="700" y="396" width="540" height="1" fill="url(#hair)" opacity="0.6"/>
</svg>

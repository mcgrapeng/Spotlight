<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Spotlight">
  <defs>
    <linearGradient id="spotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#8EC5FF"/>
      <stop offset="55%" stop-color="#EFADF7"/>
      <stop offset="100%" stop-color="#FFD69B"/>
    </linearGradient>
    <radialGradient id="spotCore" cx="40%" cy="40%" r="65%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%"  stop-color="#EFADF7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7C5BD9" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%"   stop-color="#1C1B22"/>
      <stop offset="100%" stop-color="#0B0B12"/>
    </radialGradient>
  </defs>

  <!-- Rounded-square dark plate -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Soft outer halo (the "spotlight" glow) -->
  <circle cx="32" cy="32" r="26" fill="url(#spotGrad)" opacity="0.10"/>

  <!-- Spokes (hairline scan beams) -->
  <g stroke="#FAFAFA" stroke-width="0.9" stroke-linecap="round" opacity="0.55">
    <line x1="32" y1="32" x2="32" y2="8"/>
    <line x1="32" y1="32" x2="51.82" y2="20"/>
    <line x1="32" y1="32" x2="51.82" y2="44"/>
    <line x1="32" y1="32" x2="32" y2="56"/>
    <line x1="32" y1="32" x2="12.18" y2="44"/>
    <line x1="32" y1="32" x2="12.18" y2="20"/>
  </g>

  <!-- Outer hexagon (gradient) -->
  <polygon points="32,8 51.82,20 51.82,44 32,56 12.18,44 12.18,20"
           fill="none" stroke="url(#spotGrad)" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Inner echo hexagon -->
  <polygon points="32,17 43.18,23.5 43.18,40.5 32,47 20.82,40.5 20.18,23.5"
           fill="none" stroke="#FAFAFA" stroke-width="0.7" opacity="0.30"/>

  <!-- Lens (the "spotlight" itself) -->
  <circle cx="32" cy="32" r="7.2" fill="#0B0B12" stroke="#FAFAFA" stroke-width="1.6"/>
  <!-- Focal point -->
  <circle cx="32" cy="32" r="3.4" fill="url(#spotCore)"/>
  <!-- Highlight -->
  <circle cx="30.4" cy="30.4" r="0.9" fill="#FFFFFF" opacity="0.9"/>
</svg>

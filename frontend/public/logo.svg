<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="spotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#8EC5FF"/>
      <stop offset="55%" stop-color="#EFADF7"/>
      <stop offset="100%" stop-color="#FFD69B"/>
    </linearGradient>
    <radialGradient id="spotCore" cx="40%" cy="40%" r="65%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="40%"  stop-color="#EFADF7"/>
      <stop offset="100%" stop-color="#7C5BD9"/>
    </radialGradient>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%"   stop-color="#1C1B22"/>
      <stop offset="100%" stop-color="#0B0B12"/>
    </radialGradient>
  </defs>

  <!-- plate -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>
  <!-- halo -->
  <circle cx="16" cy="16" r="13" fill="url(#spotGrad)" opacity="0.10"/>
  <!-- spokes -->
  <g stroke="#FAFAFA" stroke-width="0.45" stroke-linecap="round" opacity="0.55">
    <line x1="16" y1="16" x2="16"    y2="4"/>
    <line x1="16" y1="16" x2="25.91" y2="10"/>
    <line x1="16" y1="16" x2="25.91" y2="22"/>
    <line x1="16" y1="16" x2="16"    y2="28"/>
    <line x1="16" y1="16" x2="6.09"  y2="22"/>
    <line x1="16" y1="16" x2="6.09"  y2="10"/>
  </g>
  <!-- outer hex -->
  <polygon points="16,4 25.91,10 25.91,22 16,28 6.09,22 6.09,10"
           fill="none" stroke="url(#spotGrad)" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- inner echo -->
  <polygon points="16,8.5 21.59,11.75 21.59,20.25 16,23.5 10.41,20.25 10.41,11.75"
           fill="none" stroke="#FAFAFA" stroke-width="0.35" opacity="0.30"/>
  <!-- lens -->
  <circle cx="16" cy="16" r="3.6" fill="#0B0B12" stroke="#FAFAFA" stroke-width="0.8"/>
  <!-- focal -->
  <circle cx="16" cy="16" r="1.7" fill="url(#spotCore)"/>
</svg>
